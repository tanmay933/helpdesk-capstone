apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: helpdesk-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - helpdesk
  selector:
    matchLabels:
      app: helpdesk-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
